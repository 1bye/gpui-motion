name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo test --locked --features demo,native-tests
      - run: cargo test --locked --features demo,native-tests --example motion_showcase
      - run: cargo clippy --locked --all-targets --features demo,native-tests -- -D warnings
      - run: cargo doc --locked --no-deps --features gpui
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --release --features demo --examples
      - run: cargo publish --dry-run --locked --features gpui
