name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features text
      - run: cargo clippy --locked --no-default-features --features text --all-targets -- -D warnings
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - run: cargo doc --locked --no-deps --features gpui --target x86_64-unknown-linux-gnu
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: -D warnings
      - name: Install Kit documentation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev
      - run: cargo doc --manifest-path integrations/gpui-kit/Cargo.toml --locked --no-deps --target x86_64-unknown-linux-gnu
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: -D warnings
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo test --locked --features demo,native-tests
      - run: cargo test --locked --features demo,native-tests --example motion_showcase
      - run: cargo clippy --locked --all-targets --features demo,native-tests -- -D warnings
      - run: cargo doc --locked --no-deps --features gpui
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --release --features demo --examples
      - run: cargo publish --dry-run --locked --features gpui

  spacing:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustc-dev,llvm-tools-preview,rust-src
      - run: cargo +nightly-2026-08-20 install cargo-dylint dylint-link --version 6.2.0 --locked
      - run: python3 -m unittest discover -s scripts -p test_readme.py -v
      - run: python3 scripts/check_spacing.py
      - run: python3 scripts/test_readme_integration.py -v

  kit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: integrations/gpui-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --features demo,native-tests
      - run: cargo test --locked --features demo,native-tests --example showcase
      - run: cargo test --locked --features demo,native-tests --example text_motion
      - run: cargo clippy --locked --all-targets --features demo,native-tests -- -D warnings
      - run: cargo doc --locked --no-deps --features demo
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --features demo --examples
      - run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustc-dev,llvm-tools-preview,rust-src
      - run: cargo +nightly-2026-08-20 install cargo-dylint dylint-link --version 6.2.0 --locked
      - run: cargo publish --dry-run --locked
      - run: cargo check --locked --manifest-path target/package/gpui-motion-kit-0.2.0/Cargo.toml --target-dir target --features demo --examples
      - run: python3 ../../scripts/check_spacing.py --project .
