[package]
name = "gpui-ce-motion"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
publish = ["crates-io"]
description = "Declarative, interruptible animations, transitions, and text motion for GPUI CE"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/1bye/gpui-motion"
documentation = "https://docs.rs/gpui-ce-motion"
keywords = ["gpui", "animation", "spring", "native", "ui"]
categories = ["gui", "graphics"]
include = ["src/**", "docs/**", "examples/**", "PUBLISHING.md", "CHANGELOG.md", "tests/**", "benches/**", "README.md", "PERFORMANCE.md", "COVERAGE.md", "LICENSE-*", "Cargo.toml"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[features]
default = []
text = ["dep:unicode-segmentation"]
gpui = ["dep:gpui", "text", "svg-path"]
svg-path = ["dep:svgtypes"]
# Window-system backends are only needed to run the demos.
demo = ["gpui", "dep:gpui_platform"]
# Opt-in headless tests of real CE layout/prepaint/input, excluded from normal builds.
native-tests = ["gpui", "gpui/test-support"]

[dependencies]
svgtypes = { version = "0.15.3", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
# Match the published CE API; no workspace patches or Git dependencies.
gpui = { package = "gpui-ce", version = "=0.2.2", default-features = false, optional = true }

gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", optional = true, features = ["font-kit", "wayland", "x11"] }

[package.metadata.docs.rs]
features = ["gpui"]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[[bench]]
name = "sampling"
harness = false

[[test]]
name = "layout_native"
required-features = ["native-tests"]

[[bench]]
name = "layout_native"
harness = false
required-features = ["native-tests"]

[[test]]
name = "advanced_native"
required-features = ["native-tests"]

[[bench]]
name = "advanced_native"
harness = false
required-features = ["native-tests"]

[[example]]
name = "gpui_eval"
required-features = ["demo"]

[[example]]
name = "layout_motion"
required-features = ["demo"]

[[example]]
name = "motion"
required-features = ["demo"]

[[example]]
name = "motion_features"
required-features = ["demo"]

[[example]]
name = "motion_native"
required-features = ["demo"]

[[example]]
name = "motion_showcase"
required-features = ["demo"]

[[example]]
name = "sidebar"
required-features = ["demo"]

[[example]]
name = "svg_motion"
required-features = ["demo"]

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/1bye/workflow", rev = "f62c7d7dcdf3ffd9b77de95a523544a0c688bb9b", pattern = "rust/spacing" }]

[[test]]
name = "text_native"
required-features = ["native-tests"]

[[example]]
name = "text_motion"
required-features = ["demo"]

[[bench]]
name = "text_sampling"
harness = false
required-features = ["text"]

[[bench]]
name = "text_native"
harness = false
required-features = ["native-tests"]

[[test]]
name = "spatial_native"
required-features = ["native-tests"]

[[example]]
name = "motion_lab"
required-features = ["demo"]

[[bench]]
name = "graph"
harness = false

[[bench]]
name = "motion_lab"
harness = false
required-features = ["demo", "native-tests"]
