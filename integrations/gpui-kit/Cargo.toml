[package]
name = "gpui-motion-kit"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
publish = ["crates-io"]
description = "Declarative, interruptible animations and text motion for GPUI Kit"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1bye/gpui-motion"
documentation = "https://docs.rs/gpui-motion-kit"
keywords = ["gpui", "animation", "spring", "native", "ui"]
categories = ["gui", "graphics"]
# Native tests/benchmarks share fixtures with the CE crate in the repository.
include = ["src/**", "examples/**", "README.md", "LICENSE-*", "Cargo.toml"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[workspace]

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/1bye/workflow", rev = "f62c7d7dcdf3ffd9b77de95a523544a0c688bb9b", pattern = "rust/spacing" }]

[features]
default = []
demo = ["gpui-kit/component", "gpui-kit/assets"]
native-tests = ["gpui-kit/test-support"]

[dependencies]
gpui-ce-motion = { path = "../..", version = "0.3.0", default-features = false, features = ["text", "svg-path"] }
gpui-kit = { version = "=0.7.3", default-features = false }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev]
debug = 0
incremental = false

[[example]]
name = "showcase"
path = "examples/showcase/main.rs"
required-features = ["demo"]

[[bench]]
name = "kit_layout"
harness = false
required-features = ["native-tests"]

[[test]]
name = "kit_native"
required-features = ["native-tests"]

[[example]]
name = "text_motion"
required-features = ["demo"]

[[test]]
name = "text_native"
required-features = ["native-tests"]

[[bench]]
name = "text_native"
harness = false
required-features = ["native-tests"]

[[test]]
name = "helpers_native"
required-features = ["native-tests"]

[[test]]
name = "playback_native"
required-features = ["native-tests"]

[[bench]]
name = "helpers_native"
harness = false
required-features = ["native-tests"]

[[example]]
name = "helpers"
required-features = ["demo"]

[[test]]
name = "spatial_native"
required-features = ["native-tests"]

[[example]]
name = "motion_lab"
required-features = ["demo"]

[[bench]]
name = "motion_lab"
harness = false
required-features = ["demo", "native-tests"]
